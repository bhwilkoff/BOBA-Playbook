name: Deploy bobaplaybook.com

# Custom Pages workflow that replaces the default `pages-build-deployment`.
# Reason: the default workflow tars the whole repo, which choked on
# dangling symlinks in `.claude/skills/*` and would also leak dev-only
# files (iOS/Android source, internal *.md docs, build artifacts,
# credentials) into the deployed site. This workflow assembles a clean
# `_site/` directory containing only the web deliverables, then
# uploads + deploys via the official Pages actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Single deploy job; cancel in-progress runs for the same branch.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble _site/
        # BOBA Playbook shut down 2026-11-21. The live site is now a static
        # shutdown notice plus the legal pages (Play requires the data-deletion
        # URL to stay reachable). The web app source stays in the repo root
        # for reference but is no longer deployed.
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp -v site/index.html CNAME .nojekyll _site/
          cp -v site/index.html _site/404.html
          cp -r terms privacy data-deletion _site/
          cp -r assets/icons _site/assets/
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
