# pipeline-stage-a-scrape-radish.yml
#
# Stage A — Radish PriceGuide sourcer for missing-art bobaIds.
#
# Better long-tail coverage than eBay because Radish lists card pages
# regardless of recent sales. Probes (year, slug) namespaces in order
# of likelihood (catalog set hint first), extracts Cloudinary URLs from
# the rendered card page, downloads, uploads to R2 staging, inserts
# pipeline_image_candidates with target_boba_id set.
#
# Runs on Linux (Radish doesn't bot-block GH Actions runner IPs the
# way eBay does).

name: pipeline · stage A · scrape Radish

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max cards to query this run'
        required: false
        default: '200'
      probe_delay:
        description: 'Seconds between Radish requests'
        required: false
        default: '0.3'
  schedule:
    # Daily at 03:30 UTC — 30 min after the eBay sourcer so we don't
    # double-tap a candidate during the same hour.
    - cron: '30 3 * * *'

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape Radish for missing-art targets
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/scripts/requirements.txt

      - name: Install Python deps
        run: pip install -r pipeline/scripts/requirements.txt

      - name: Run Stage A (Radish)
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY:        ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY:        ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET:            boba-card-images
        run: |
          python pipeline/scripts/stage_a_scrape_radish.py \
            --repo-root    . \
            --limit        ${{ github.event.inputs.limit       || '200' }} \
            --probe-delay  ${{ github.event.inputs.probe_delay || '0.3' }}
