name: Refresh blog feed

# Pulls the latest BoBA blog posts into docs/blog-feed.json + the
# companion docs/blog-digest.md so the autonomous /loop can mine them
# for content / feature ideas (autonomous-loop-cadence skill —
# "mining research folders for user requests"). Source of truth is
# https://bobattlearena.com/blog/all enriched with WP REST dates.

on:
  schedule:
    # Daily at 05:17 UTC — staggered off the events refresh (04:13) so
    # the two jobs don't collide on the same minute.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh blog feed JSON
        run: python3 scripts/refresh_blog.py --output docs/blog-feed.json

      - name: Regenerate blog digest markdown
        run: python3 scripts/build_blog_digest.py

      - name: Mirror to platform bundles (iOS + Android + web)
        run: |
          cp docs/blog-feed.json android/app/src/main/assets/data/blog-feed.json
          cp docs/blog-feed.json BOBAPlaybook/blog-feed.json
          cp docs/blog-feed.json assets/data/blog-feed.json

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet docs/blog-feed.json docs/blog-digest.md \
              android/app/src/main/assets/data/blog-feed.json BOBAPlaybook/blog-feed.json \
              assets/data/blog-feed.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/blog-feed.json docs/blog-digest.md \
              android/app/src/main/assets/data/blog-feed.json BOBAPlaybook/blog-feed.json \
              assets/data/blog-feed.json
          git commit -m "chore(blog): daily refresh $(date -u +%Y-%m-%d)"
          git push

      - name: No-op notice
        if: steps.diff.outputs.changed == 'false'
        run: echo "No changes today — nothing to commit."
