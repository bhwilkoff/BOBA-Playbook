name: Refresh events

on:
  schedule:
    # Daily at 04:13 UTC — off-cluster timing per the same pattern as
    # refresh-stores.yml. Whatnot upcoming churns weekly; once-a-day
    # commits keep events.json fresh without flooding history.
    - cron: '13 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run refresh
        run: python3 scripts/refresh_events.py --output assets/data/events.json

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet assets/data/events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/events.json
          git commit -m "chore(events): daily refresh $(date -u +%Y-%m-%d)"
          git push

      - name: No-op notice
        if: steps.diff.outputs.changed == 'false'
        run: echo "No changes today — nothing to commit."
