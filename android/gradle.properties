# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Performance — give Gradle a real memory budget.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is required for new apps.
android.useAndroidX=true

# Non-transitive R classes — slightly faster builds + cleaner R refs per module.
android.nonTransitiveRClass=true

# Kotlin code style.
kotlin.code.style=official

# KSP2 is default since Kotlin 2.0.
ksp.useKSP2=true
