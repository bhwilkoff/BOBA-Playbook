# BOBA Playbook — Android version catalog
#
# Single source of truth for every dependency version across modules.
# When Android Studio asks to bump a version, edit it here and let the
# version catalog propagate to every module.
#
# Pinned versions reflect the current modern stack (May 2026):
#   - Android Studio Panda 4 Patch 1 (2025.3.4)
#   - AGP 9.2.0 (Kotlin support built-in — no kotlin.android plugin needed)
#   - Kotlin 2.1.21
#   - Compose BOM 2026.05.00 (Compose 1.11.1)
#   - Material 3 Expressive APIs (alpha-train via BOM override)
#   - Navigation 3 1.0.1 (stable; supersedes Navigation Compose 2.x)
#   - Coil 3.4.0 (KMP-ready stable)
#   - Ktor 3.4.3
#   - Hilt 2.57.1 (KSP-native)
#   - Gradle 9.1+ required by AGP 9.1+
#   - JDK 17 required by AGP 9.1+ (JDK 21 commonly bundled with Studio)
#
# AGP 9 IMPORTANT CHANGE: the `org.jetbrains.kotlin.android` plugin is
# no longer needed for Android modules — AGP auto-applies Kotlin
# support. We still need `kotlin.compose`, `kotlin.serialization`,
# `kotlin.jvm` (for :core:domain), and `ksp` / `hilt` plugins.

[versions]
# Build tooling
agp                       = "9.2.1"
kotlin                    = "2.3.21"
ksp                       = "2.3.8"
compose-bom               = "2026.05.00"
# Material 3 Expressive alpha (FAB Menu, Floating Toolbar, Wavy
# Indicators, expressive motion tokens). Requires compileSdk 37 +
# Android 17 SDK installed — we have both, so unlock.
compose-material3         = "1.5.0-alpha19"
material3-adaptive        = "1.1.0"
hilt                      = "2.59.2"
nav3                      = "1.0.1"
room                      = "2.7.0"              # KMP-capable
ktor                      = "3.4.3"
coil                      = "3.4.0"
supabase                  = "3.0.2"
camerax                   = "1.4.0"
mlkit-text                = "19.0.1"
biometric                 = "1.4.0-alpha02"
credentials               = "1.3.0"
play-services-auth        = "21.2.0"
googleid                  = "1.1.1"
work                      = "2.10.0"
serialization             = "1.7.3"
datastore                 = "1.1.2"
tink                      = "1.15.0"
collections-immutable     = "0.3.8"
turbine                   = "1.2.0"
mockk                     = "1.13.13"
roborazzi                 = "1.30.1"
robolectric               = "4.13"
androidx-core             = "1.13.1"
androidx-browser          = "1.8.0"
androidx-lifecycle        = "2.8.7"
androidx-activity         = "1.9.3"
splashscreen              = "1.0.1"
window                    = "1.3.0"
firebase-bom              = "34.13.0"
junit                     = "4.13.2"
junit-androidx            = "1.2.1"
espresso                  = "3.6.1"
coroutines                = "1.9.0"
okhttp                    = "4.12.0"
# Google Maps SDK (Find a Store map — parity with iOS MapKit + web Leaflet).
# play-services-maps 19.x supports Android 16's edge-to-edge inset model.
# maps-compose 6.x ships GoogleMap composable + Marker + CameraPositionState.
play-services-maps        = "19.0.0"
maps-compose              = "6.1.2"

# Project SDK targets (DECISIONS.md #041, #047)
min-sdk                   = "29"      # Android 10 — >95% device coverage
target-sdk                = "36"      # Android 16 — minimum-required for Play Store publish in 2026
compile-sdk               = "37"      # Android 17 — Material 3 Expressive APIs require this

[libraries]
# ----- Compose -----
compose-bom                 = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui                  = { module = "androidx.compose.ui:ui" }
compose-ui-tooling          = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview  = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4      = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest    = { module = "androidx.compose.ui:ui-test-manifest" }
compose-foundation          = { module = "androidx.compose.foundation:foundation" }
# Material 3 — pinned to the Expressive alpha line so we can opt into
# FAB Menu, Floating Toolbar, Wavy Indicators, expressive motion.
# Overrides the BOM's stable for this artifact only.
compose-material3           = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-material3-adaptive  = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3-adaptive" }
compose-material3-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "material3-adaptive" }
compose-material3-adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "material3-adaptive" }
compose-material3-adaptive-nav-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-animation           = { module = "androidx.compose.animation:animation" }

# ----- AndroidX core -----
androidx-core-ktx           = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-browser            = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-core-splashscreen  = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-window             = { module = "androidx.window:window", version.ref = "window" }

# ----- Google Maps (Find a Store) -----
play-services-maps          = { module = "com.google.android.gms:play-services-maps", version.ref = "play-services-maps" }
maps-compose                = { module = "com.google.maps.android:maps-compose", version.ref = "maps-compose" }

# ----- Navigation 3 — Compose-first new generation -----
nav3-runtime                = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3" }
nav3-ui                     = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3" }

# ----- Navigation Compose 2.x — stable, the workhorse. Used today. -----
nav-compose                 = { module = "androidx.navigation:navigation-compose", version = "2.8.5" }

# ----- DI -----
hilt-android                = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler               = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-nav-compose            = { module = "androidx.hilt:hilt-navigation-compose", version = "1.2.0" }

# ----- Networking -----
ktor-client-core            = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp          = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json     = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging         = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
okhttp                      = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# ----- Supabase -----
supabase-bom                = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-postgrest          = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-auth               = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-realtime           = { module = "io.github.jan-tennert.supabase:realtime-kt" }
supabase-compose-auth       = { module = "io.github.jan-tennert.supabase:compose-auth" }
supabase-compose-auth-ui    = { module = "io.github.jan-tennert.supabase:compose-auth-ui" }

# ----- Image loading -----
coil-compose                = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp         = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# ----- Camera + ML Kit -----
camerax-core                = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camerax-camera2             = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle           = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view                = { module = "androidx.camera:camera-view", version.ref = "camerax" }
camerax-mlkit               = { module = "androidx.camera:camera-mlkit-vision", version.ref = "camerax" }
mlkit-text-recognition      = { module = "com.google.android.gms:play-services-mlkit-text-recognition", version.ref = "mlkit-text" }

# ----- Persistence -----
room-runtime                = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx                    = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler               = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore-preferences       = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
tink-android                = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }

# ----- Auth + security -----
credentials                 = { module = "androidx.credentials:credentials", version.ref = "credentials" }
credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid                    = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
biometric-compose           = { module = "androidx.biometric:biometric-compose", version.ref = "biometric" }

# ----- Firebase -----
firebase-bom                = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-messaging          = { module = "com.google.firebase:firebase-messaging" }

# ----- Other -----
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collections-immutable" }
coroutines-android          = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core             = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

# ----- Testing -----
junit                       = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit     = { module = "androidx.test.ext:junit", version.ref = "junit-androidx" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
turbine                     = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockk                       = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android               = { module = "io.mockk:mockk-android", version.ref = "mockk" }
roborazzi                   = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose           = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule        = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
robolectric                 = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
coroutines-test             = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application         = { id = "com.android.application", version.ref = "agp" }
android-library             = { id = "com.android.library", version.ref = "agp" }
# AGP 9 auto-applies Kotlin for Android modules; the `kotlin.android`
# plugin is no longer needed. We keep `kotlin.jvm` (pure Kotlin :core:
# domain), `kotlin.compose` (Compose Compiler), `kotlin.serialization`
# (kotlinx.serialization codegen).
kotlin-jvm                  = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                         = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                        = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services             = { id = "com.google.gms.google-services", version = "4.4.4" }
roborazzi                   = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
