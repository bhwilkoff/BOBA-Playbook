<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BOBA Playbook</title>
  <meta name="description" content="The definitive companion app for the Bo Jackson Battle Arena trading card game.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BOBA Playbook">
  <meta name="theme-color" content="#080810">
  <!-- Smart App Banner — uncomment when iOS app is on the App Store -->
  <!-- <meta name="apple-itunes-app" content="app-id=YOUR_APP_ID"> -->
  <link rel="icon" href="assets/icons/boba_playbook_icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/boba_playbook_icon_60.png" type="image/png" sizes="60x60">
  <link rel="apple-touch-icon" href="assets/icons/boba_playbook_icon_180.png" sizes="180x180">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Russo+One&family=Chakra+Petch:wght@300;400;500;600;700&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Mobile header -->
  <header class="mobile-header" id="mobile-header">
    <button class="hamburger" id="sidebar-toggle"
            aria-label="Open navigation" aria-expanded="false" aria-controls="channels-sidebar">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-title"><span class="mobile-title-boba">BOBA</span><span class="mobile-title-playbook"> Playbook</span></span>
  </header>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

  <!-- Sidebar -->
  <aside id="channels-sidebar" class="channels-sidebar" aria-label="Navigation">
    <div class="sidebar-header">
      <div class="sidebar-wordmark">
        <span class="sidebar-boba">BOBA</span>
        <span class="sidebar-playbook">Playbook</span>
      </div>
      <span class="sidebar-tagline">Search. Scan. Collect. Play.</span>
    </div>
    <nav class="sidebar-nav" aria-label="Main navigation">
      <button class="sidebar-nav-item active" id="nav-search-btn" data-view="search">
        <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <span>Search Cards</span>
      </button>
      <button class="sidebar-nav-item" id="nav-rules-btn" data-view="rules">
        <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
          <rect x="2" y="2" width="20" height="20" rx="4"/>
          <path fill="#080810" d="M13.5 4l-5 7h4.5l-2 9 7-9h-5z"/>
        </svg>
        <span>Play</span>
      </button>
      <button class="sidebar-nav-item" id="nav-collection-btn" data-view="collection">
        <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="6" height="8" rx="1"/><rect x="9" y="3" width="6" height="8" rx="1"/><rect x="16" y="3" width="6" height="8" rx="1"/>
          <rect x="2" y="13" width="6" height="8" rx="1"/><rect x="9" y="13" width="6" height="8" rx="1"/><rect x="16" y="13" width="6" height="8" rx="1"/>
        </svg>
        <span>My Collection</span>
      </button>
      <button class="sidebar-nav-item" id="nav-profile-btn" data-view="profile">
        <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Profile</span>
      </button>
    </nav>
  </aside>

  <!-- Main content -->
  <main id="main-content">

    <!-- SEARCH VIEW -->
    <section id="view-search" class="view" aria-label="Search Cards">

      <div class="search-header">
        <div class="search-controls">
          <div class="search-bar-wrap">
            <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="search" id="search-input" class="search-input"
                   placeholder="Search cards, heroes, numbers…"
                   autocomplete="off" autocorrect="off" spellcheck="false"
                   aria-label="Search cards">
            <button class="search-clear" id="search-clear" hidden aria-label="Clear search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14">
                <path d="M18 6 6 18M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <button class="filter-toggle-btn" id="filter-toggle-btn"
                  aria-expanded="false" aria-controls="filter-panel" aria-label="Toggle filters">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true">
              <line x1="4" y1="6" x2="20" y2="6"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
              <line x1="11" y1="18" x2="13" y2="18"/>
            </svg>
            <span class="filter-badge" id="filter-badge" hidden aria-hidden="true"></span>
          </button>
        </div>

        <div class="results-bar">
          <span class="results-count" id="search-count" aria-live="polite" aria-atomic="true"></span>
          <button class="has-image-toggle" id="has-image-toggle" aria-pressed="false">
            Has Image
          </button>
        </div>
      </div>

      <div class="filter-panel" id="filter-panel" aria-hidden="true">
        <div class="filter-bar">
          <div class="filter-scroll" id="element-filters" role="group" aria-label="Filter by element"></div>
          <div class="filter-selects">
            <select class="filter-select" id="set-filter" aria-label="Filter by set">
              <option value="">All Sets</option>
            </select>
            <select class="filter-select" id="treatment-filter" aria-label="Filter by treatment">
              <option value="">All Treatments</option>
            </select>
          </div>

          <div class="power-range-group" role="group" aria-label="Filter by power range">
            <span class="filter-label-text">Power</span>
            <input type="number" class="power-input" id="power-min" placeholder="Min"
                   aria-label="Minimum power" min="0">
            <span class="power-range-sep">–</span>
            <input type="number" class="power-input" id="power-max" placeholder="Max"
                   aria-label="Maximum power" min="0">
            <div class="power-presets" role="group" aria-label="Power presets">
              <button class="power-preset active" data-min="" data-max="">Any</button>
              <button class="power-preset" data-min="" data-max="114">Low</button>
              <button class="power-preset" data-min="115" data-max="139">Mid</button>
              <button class="power-preset" data-min="140" data-max="164">High</button>
              <button class="power-preset" data-min="165" data-max="">Elite</button>
            </div>
          </div>
        </div>
      </div>

      <div class="loading-state" id="loading-state" aria-live="polite">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p>Loading card catalog…</p>
      </div>

      <div class="card-grid" id="card-grid" role="list" aria-label="Card results" hidden></div>

      <div class="empty-state" id="empty-state" hidden>
        <p>No cards match your search.</p>
        <button class="btn-ghost-sm" id="clear-filters-btn">Clear all filters</button>
      </div>

      <div class="load-sentinel" id="load-sentinel" aria-hidden="true"></div>

    </section>

    <!-- PLAY VIEW -->
    <section id="view-rules" class="view" hidden aria-label="Play">
      <div class="view-inner">
        <h2 class="view-heading">Play</h2>
        <p class="placeholder-text">Rulebook, per-card strategy tips, and deck builder — coming in M4.</p>
      </div>
    </section>

    <!-- COLLECTION VIEW — rendered by collection.js -->
    <section id="view-collection" class="view" hidden aria-label="My Collection"></section>

    <!-- PROFILE VIEW — rendered by collection.js -->
    <section id="view-profile" class="view" hidden aria-label="Profile"></section>

  </main>

  <!-- CARD DETAIL MODAL -->
  <div class="modal-overlay" id="card-modal-overlay" hidden
       role="dialog" aria-modal="true" aria-labelledby="modal-card-name">
    <div class="modal" id="card-modal">
      <button class="modal-close" id="modal-close-btn" aria-label="Close card detail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div class="modal-overlay" id="auth-modal-overlay" hidden
       role="dialog" aria-modal="true" aria-label="Sign in to BOBA Playbook">
    <div class="auth-modal-box" id="auth-modal-box"></div>
  </div>

  <!-- ADD TO COLLECTION SHEET -->
  <div class="modal-overlay" id="add-collection-overlay" hidden
       role="dialog" aria-modal="true" aria-label="Add card to collection">
    <div class="auth-modal-box add-collection-box" id="add-collection-box"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/collection.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
