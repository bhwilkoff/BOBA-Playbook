<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_brand.css" />
  <link rel="stylesheet" href="_phone.css" />
  <style>
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }
    .a1 { --card-art-bg: linear-gradient(135deg, #ff4d00 0%, #cc3a00 100%); }
    .a2 { --card-art-bg: linear-gradient(135deg, #00bfff 0%, #0080a0 100%); }
    .a3 { --card-art-bg: linear-gradient(135deg, #8B00FF 0%, #5a0099 100%); }
    .a4 { --card-art-bg: linear-gradient(135deg, #FFD700 0%, #cc9c00 100%); }
    .a5 { --card-art-bg: linear-gradient(135deg, #C0392B 0%, #8a261d 100%); }
    .a6 { --card-art-bg: linear-gradient(135deg, #00BFFF 0%, #006d99 100%); }
    .a7 { --card-art-bg: linear-gradient(135deg, #8A9BB0 0%, #4f5a6e 100%); }
    .a8 { --card-art-bg: linear-gradient(135deg, #FF69B4 0%, #c84a8b 100%); }
    .a9 { --card-art-bg: linear-gradient(135deg, #FF4D00 0%, #993000 100%); }
  </style>
</head>
<body>
<div class="shot">
  <div class="shot-headline">
    <div class="label">Search</div>
    <div class="title"><span class="accent">17,000+</span><br/>Cards</div>
    <div class="sub">Every release, every treatment, every parallel — filtered by weapon, hero, set, or set you found in the wild.</div>
  </div>
  <div class="shot-mockup">
    <div class="search-bar" style="margin-bottom: 22px;">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zM10 14a4 4 0 1 1 0-8 4 4 0 0 1 0 8"/></svg>
      Bo Jackson, Maverick, RBF-72…
    </div>
    <div style="display:flex; gap:12px; margin-bottom:22px;">
      <div class="chip selected">FIRE</div>
      <div class="chip">ICE</div>
      <div class="chip">HEX</div>
      <div class="chip">STEEL</div>
      <div class="chip">GLOW</div>
    </div>
    <div class="grid">
      <div class="card-cell"><div class="art a1">98</div><div class="label">Bo Jackson</div></div>
      <div class="card-cell"><div class="art a2">85</div><div class="label">Maverick</div></div>
      <div class="card-cell"><div class="art a3">120</div><div class="label">D-Harp</div></div>
      <div class="card-cell"><div class="art a4">75</div><div class="label">Tigre</div></div>
      <div class="card-cell"><div class="art a5">110</div><div class="label">JacHammer</div></div>
      <div class="card-cell"><div class="art a6">90</div><div class="label">Zephyr</div></div>
    </div>
  </div>
</div>
</body>
</html>
