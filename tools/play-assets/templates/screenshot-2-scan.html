<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_brand.css" />
  <link rel="stylesheet" href="_phone.css" />
  <style>
    .viewfinder {
      position: relative;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(160deg, #1c0a02 0%, #050505 100%);
      display: flex;
      flex-direction: column;
    }
    .frame-art {
      position: absolute; inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .frame-art .card-mock {
      width: 520px; height: 720px;
      background: linear-gradient(135deg, #ff4d00 0%, #b53400 50%, #6a1f00 100%);
      border-radius: 24px;
      position: relative;
      box-shadow: 0 24px 80px rgba(0,0,0,0.7);
      transform: rotate(-3deg);
    }
    .frame-art .card-mock::before {
      content: "RBF-72";
      position: absolute; top: 28px; left: 32px;
      font-family: "Chakra Petch Fallback", monospace;
      font-size: 28px;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.1em;
    }
    .frame-art .card-mock::after {
      content: "MAVERICK";
      position: absolute; bottom: 90px; left: 0; right: 0;
      text-align: center;
      font-family: "Bebas Neue Fallback", Impact, sans-serif;
      font-size: 64px;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.95);
    }
    .frame-art .power {
      position: absolute; top: 24%; left: 0; right: 0;
      text-align: center;
      font-family: "Bebas Neue Fallback", Impact, sans-serif;
      font-size: 240px;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transform: rotate(-3deg);
    }

    /* Scan reticle — 4 corner brackets */
    .reticle {
      position: absolute;
      top: 50%; left: 50%;
      width: 620px; height: 820px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .reticle::before, .reticle::after,
    .reticle .br, .reticle .bl {
      content: "";
      position: absolute;
      width: 80px; height: 80px;
      border-color: var(--boba-cyan);
      border-style: solid;
      border-width: 0;
    }
    .reticle::before { top: 0;    left: 0;    border-top-width:    8px; border-left-width:  8px; border-top-left-radius:  12px; }
    .reticle::after  { top: 0;    right: 0;   border-top-width:    8px; border-right-width: 8px; border-top-right-radius: 12px; }
    .reticle .br     { bottom: 0; right: 0;   border-bottom-width: 8px; border-right-width: 8px; border-bottom-right-radius: 12px; }
    .reticle .bl     { bottom: 0; left: 0;    border-bottom-width: 8px; border-left-width:  8px; border-bottom-left-radius:  12px; }

    /* Detection chip below the card */
    .detection {
      position: absolute;
      bottom: 60px; left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 13, 26, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 245, 255, 0.5);
      border-radius: 22px;
      padding: 22px 32px;
      display: flex;
      gap: 22px;
      align-items: center;
      box-shadow: 0 12px 48px rgba(0, 245, 255, 0.15);
    }
    .detection .thumb {
      width: 80px; height: 112px;
      background: linear-gradient(135deg, #ff4d00 0%, #cc3a00 100%);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: "Bebas Neue Fallback", Impact, sans-serif;
      font-size: 38px; color: white;
    }
    .detection .text {
      display: flex; flex-direction: column; gap: 4px;
    }
    .detection .name {
      font-family: "Bebas Neue Fallback", Impact, sans-serif;
      font-size: 36px;
      color: var(--boba-text);
      letter-spacing: 0.04em;
    }
    .detection .num {
      font-family: "Chakra Petch Fallback", monospace;
      font-size: 22px;
      color: var(--boba-cyan);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
<div class="shot">
  <div class="shot-headline">
    <div class="label">Scan</div>
    <div class="title">Point.<br/><span class="accent">Identify.</span></div>
    <div class="sub">Camera-based card recognition runs entirely on-device. Your photos never leave your phone.</div>
  </div>
  <div class="shot-mockup">
    <div class="viewfinder">
      <div class="frame-art">
        <div class="card-mock">
          <div class="power">85</div>
        </div>
      </div>
      <div class="reticle"><div class="br"></div><div class="bl"></div></div>
      <div class="detection">
        <div class="thumb">85</div>
        <div class="text">
          <div class="name">Maverick</div>
          <div class="num">RBF-72  ·  FIRE  ·  Red Battlefoil</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
