name            = "boba-mod-merge"
main            = "worker.js"
compatibility_date = "2024-09-01"

# R2 binding — reuses the existing boba-card-images bucket where the
# rest of the catalog images live (full/, thumbs/, sealed/, avatars/).
[[r2_buckets]]
binding     = "R2_CDN"
bucket_name = "boba-card-images"

# Secrets (set via `wrangler secret put <NAME>` after `wrangler login`):
#   SUPABASE_URL          — https://pazkimtkwwwekuguxkff.supabase.co
#   SUPABASE_SERVICE_KEY  — service_role key (bypasses RLS for the
#                            override-row read/write + Storage fetch)
#   CF_API_TOKEN          — Zone-scoped token with "Cache Purge" perm
#                            for the zone serving pub-*.r2.dev (or
#                            custom domain). Without it, edge cache
#                            survives for up to ~1 year per the
#                            CacheControl: immutable on the existing
#                            tiers. Cache purge is best-effort; the
#                            new objects are written with max-age=300
#                            so they "win" quickly.
#   CF_ZONE_ID            — The zone ID of the R2 CDN zone.
#
# Deploy:
#   cd workers/mod-merge
#   wrangler deploy
#
# After deploying, paste the worker URL into:
#   - BOBAPlaybook/Config.swift       → WorkerConfig.modMergeURL
#   - js/api.js (modMergeOverride fn) → MOD_MERGE_WORKER_URL
