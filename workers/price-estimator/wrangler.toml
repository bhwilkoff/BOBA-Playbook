name               = "boba-price-estimator"
main               = "worker.js"
compatibility_date = "2024-01-01"

# KV namespace stores per-card market estimates.
# Create once with `wrangler kv:namespace create ESTIMATES` and paste
# the printed id below.
[[kv_namespaces]]
binding = "ESTIMATES"
id      = "b44ff8f1197646c2a4ba5563a2a68959"

# Cron schedule — nightly at 03:00 UTC. Recomputes estimates for every
# catalog card. Walks ~18k cards in batches; total runtime well under
# Cloudflare's 30-min cron-invocation cap.
[triggers]
crons = ["0 3 * * *"]

# Service binding — Worker-to-Worker fetch via public URLs gets
# 404'd by Cloudflare's edge router. Service bindings route directly
# through the runtime without going through DNS / edge.
[[services]]
binding = "EBAY_PROXY_SVC"
service = "boba-ebay-proxy"

# Tier 1 vanish-inference store — the estimator's comp source (real inferred-
# sold prices). Replaces the dead eBay-Marketplace-Insights sold path.
[[services]]
binding = "PRICING_TRACKER_SVC"
service = "boba-pricing-tracker"

# Variables
[vars]
# URL of the canonical catalog JSON the estimator reads from. GitHub
# Pages serves this with edge caching; the Worker pulls once per cron.
CATALOG_URL = "https://bobaplaybook.com/assets/data/cards.json"
# Static rarity-baseline artifact built offline by
# scripts/build_price_estimates.py from the price data we collect ourselves.
# Served as the /estimate fallback when no comp-derived KV entry exists, so
# every card whose rarity class has data gets a rough estimate (#058 · §6).
ESTIMATES_ARTIFACT_URL = "https://bobaplaybook.com/assets/data/price-estimates.json"
# eBay Marketplace Insights / Browse API proxy. The estimator delegates
# its per-card eBay queries here so the OAuth + scoring logic stays in
# one place (no Worker-to-Worker scoring duplication).
EBAY_PROXY  = "https://boba-ebay-proxy.benwilkoff.workers.dev"
# Cap on cards processed PER CRON RUN. The cron is incremental:
# skips cards whose KV estimate is fresh (within last 5 days) and
# stops at this many newly-computed entries (or at the 25-min
# wallclock soft cap, whichever fires first). At 600/night the
# 18k-card catalog rotates through in ~30 nights at steady state;
# tune up if cron consistently has time left in the wallclock budget.
PER_CRON_BUDGET = "600"
