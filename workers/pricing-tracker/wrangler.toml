name               = "boba-pricing-tracker"
main               = "worker.js"
compatibility_date = "2024-09-23"

# Tier 1 vanish-inference store (PRICING_PLAYBOOK.md §3 + DECISIONS.md #058).
# PUSH MODEL: the eBay proxy POSTs /ingest (ctx.waitUntil) on every pricing
# fetch — card-detail opens + each card of a Collection "refresh market
# values". Each ingest is its own tiny invocation (under Cloudflare's
# free-plan 50-subrequest cap), so there is NO catalog-grinding cron. Vanish-
# detection runs per-card on ingest. /comps serves inferred-sold + community.

[[d1_databases]]
binding       = "DB"
database_name = "boba-pricing"
database_id   = "918e5ec1-1286-431d-a27a-2171d7c851ba"

[vars]
# Tier 3: /comps merges approved community comps from Supabase
# (get_approved_comps RPC). SUPABASE_ANON_KEY is a wrangler secret
# (public anon key, but kept out of git): wrangler secret put SUPABASE_ANON_KEY
SUPABASE_URL = "https://pazkimtkwwwekuguxkff.supabase.co"

# No cron — the push model needs none. (The old catalog-grind cron is gone:
# 2 service-binding fetches/card × 17k cards can't fit one invocation on the
# free plan. See DECISIONS.md #058.)
